name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04

    env:
      MALUDB_ENV: test
      MALUDB_CONTROL_PLANE_DATABASE_URL: postgresql://cp_ci:cp_ci@127.0.0.1:5432/maludb_control_plane_test
      # A real MaluDB node, not a plain postgres:17 service container. Until
      # slice 0 this was a container without maludb_core, so three tests --
      # including whether `anon` can reach gen_salt, the finding ADR-018 exists
      # for -- skipped in CI and were verified on a developer machine only.
      # Phase 03 puts those functions behind a public HTTP route, which is what
      # made that unacceptable rather than merely untidy.
      MALUDB_NODE_ADMIN_DSN: postgresql://cp_ci:cp_ci@127.0.0.1:5432/postgres
      MALUDB_PLATFORM_OWNER: cp_ci
      # Turns an absent extension into a failed run rather than a skipped test.
      # Without it, a regression in this setup would quietly restore the exact
      # blind spot slice 0 exists to close.
      MALUDB_REQUIRE_MALUDB_CORE: "1"
      # Pinned so CI and the development node agree on what "MaluDB" means.
      # ADR-015 makes the installed version per-project state and notes drift is
      # already observable; a floating ref would make CI's answer unreproducible.
      # Bump deliberately, and expect the extension-version assertions to move.
      MALUDB_CORE_REF: b4d6d521cb94cb0c05cfbadd2a9958c2e5ddfc4f
      # PostgREST is the thing under test in the schema-reload assertions --
      # bootstrap 006 makes the database send NOTIFY, and only a real PostgREST
      # proves anything acts on it. Pinned for the same reason as maludb_core.
      POSTGREST_VERSION: v14.17
      MALUDB_POSTGREST_BIN: /usr/local/bin/postgrest
      # Pinned to the version Phase 00 proved the wedge against. Supabase Auth
      # is the project formerly published as GoTrue; the binary is still named
      # `auth`, with a `gotrue` symlink beside it in the release archive.
      GOTRUE_VERSION: v2.195.0
      MALUDB_GOTRUE_BIN: /usr/local/bin/gotrue
      # Phase 06 slice 1. A second cluster, because the assertions need
      # `wal_level = logical` -- which needs a restart -- and a pg_hba.conf that
      # is itself under test. The main cluster on 5432 stays `replica`, so
      # nothing here changes what the rest of the suite runs against.
      MALUDB_REALTIME_NODE_DSN: postgresql://postgres:rt_ci@127.0.0.1:5433/postgres
      # Turns an absent Realtime cluster into a failed run rather than a skipped
      # test, for the same reason MALUDB_REQUIRE_MALUDB_CORE exists: the test
      # most likely to be lost is R6b, which is the one that decides whether a
      # tenant can read every other tenant on the node.
      MALUDB_REQUIRE_REALTIME_NODE: "1"
      # Phase 06 slice 5. The data address a Realtime container reaches
      # PostgreSQL at, built by the same script: the container is given no route
      # to the node's loopback, because with one it reaches every other worker
      # on the node.
      MALUDB_REALTIME_DB_HOST: 10.90.0.1
      MALUDB_REALTIME_DB_PORT: "5433"
      # Pinned by ADR-033: latest dies with SIGILL in a precompiled Rust NIF on
      # a CPU with no AVX, which these nodes are.
      MALUDB_REALTIME_IMAGE: docker.io/supabase/realtime:v2.110.0
      # Turns an absent container runtime or image into a failed run rather than
      # a skipped test. Without it the assertions that a real server delivers
      # Postgres Changes -- and that its container cannot reach the node's
      # loopback -- disappear silently, which is the whole reason the other two
      # MALUDB_REQUIRE_* variables exist.
      MALUDB_REQUIRE_REALTIME_SERVER: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 and maludb_core build dependencies
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          # postgresql-17 carries btree_gist, pg_trgm and pgcrypto; pgvector is
          # packaged separately. maludb_core requires all four -- see the
          # `requires` line in maludb_core.control.
          # libssl-dev and libcurl4-openssl-dev are link-time requirements, not
          # optional extras: maludb_core's Makefile sets SHLIB_LINK = -lcrypto
          # -lcurl. build-essential alone gets as far as compiling and then
          # fails at link.
          sudo apt-get install -y -qq --no-install-recommends \
            postgresql-17 postgresql-17-pgvector postgresql-server-dev-17 \
            build-essential libssl-dev libcurl4-openssl-dev

      - name: Put PostgreSQL 17 on 5432
        run: |
          # The runner image ships PostgreSQL 16. Left in place, Debian's
          # packaging puts the new 17 cluster on 5433 and every DSN below would
          # quietly reach the wrong server -- one with no maludb_core. That is
          # precisely the silent-wrong-environment failure this slice exists to
          # remove, so it is made explicit rather than assumed.
          sudo pg_dropcluster 16 main --stop 2>/dev/null || true
          # The cluster is created here rather than relied on: the runner's
          # postgresql-common has create_main_cluster disabled, so installing
          # postgresql-17 lays down binaries and no server at all. Dropping any
          # existing 17 cluster first makes the step idempotent and makes the
          # port ours to choose rather than something to discover.
          sudo pg_dropcluster 17 main --stop 2>/dev/null || true
          sudo pg_createcluster 17 main --port 5432 --start
          pg_isready -h 127.0.0.1 -p 5432
          # Assert rather than echo. pg_isready passing only means *something*
          # answers on 5432; if dropping the 16 cluster had failed, that
          # something would be PostgreSQL 16 and the whole run would proceed
          # against a server with no maludb_core.
          port=$(sudo -u postgres psql -tAc "SHOW port")
          major=$(sudo -u postgres psql -tAc "SHOW server_version" | cut -d. -f1)
          echo "default cluster: PostgreSQL $major on port $port"
          [ "$port" = "5432" ] || { echo "::error::default cluster is on $port, not 5432"; exit 1; }
          [ "$major" = "17" ] || { echo "::error::default cluster is PostgreSQL $major, not 17"; exit 1; }

      - name: Build and install maludb_core
        run: |
          git clone --quiet https://github.com/maludb/maludb-core.git /tmp/maludb-core
          git -C /tmp/maludb-core checkout --quiet "$MALUDB_CORE_REF"
          # PGXS `install` only. The Makefile also offers install-services,
          # which drops systemd units and writes /etc/maludb -- neither belongs
          # on a CI runner, and ADR-012 established the extension needs neither
          # background workers nor shared_preload_libraries.
          #
          # PG_CONFIG is passed explicitly even though the Makefile currently
          # defaults to the same path: building against the wrong major would
          # install into a directory the running cluster never reads, and fail
          # as a confusing missing-extension error much later.
          make -C /tmp/maludb-core -s PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config
          sudo make -C /tmp/maludb-core -s PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config install

      - name: Create the CI superuser
        run: |
          # Superuser because provisioning creates databases, roles, and
          # installs a superuser-only extension (ADR-012). This is a disposable
          # runner, not a model for production, where a dedicated provisioning
          # role is a carried-forward item.
          sudo -u postgres psql -q -c "CREATE ROLE cp_ci LOGIN SUPERUSER PASSWORD 'cp_ci'"
          sudo -u postgres psql -q -c "CREATE DATABASE maludb_control_plane_test OWNER cp_ci"

      - name: maludb_core is actually installable
        run: |
          # Proves the setup before any test leans on it, so a broken build
          # fails here with an obvious cause rather than as a puzzling
          # assertion failure three steps later.
          sudo -u postgres psql -q -d postgres -c "CREATE DATABASE mldb_ciprobe"
          sudo -u postgres psql -q -d mldb_ciprobe -c "CREATE EXTENSION maludb_core CASCADE"
          version=$(sudo -u postgres psql -tAd mldb_ciprobe \
            -c "SELECT extversion FROM pg_extension WHERE extname = 'maludb_core'")
          echo "maludb_core $version installed from $MALUDB_CORE_REF"
          [ -n "$version" ] || { echo "::error::maludb_core did not install"; exit 1; }
          sudo -u postgres psql -q -c "DROP DATABASE mldb_ciprobe"

      - name: Build the Realtime test cluster on 5433
        run: |
          # specs/realtime-replication-model.md, "Required node preparation".
          # Separate from the main cluster because three of the five settings
          # need a restart and the pg_hba reject is a file, so this cannot be
          # done to a cluster the rest of the suite is using.
          PG_CLUSTER=rt PG_PORT=5433 RT_SUPERUSER_PW=rt_ci scripts/realtime-test-cluster.sh
          # Assert the property rather than trusting the script. A cluster that
          # silently came up without the reject would turn the R6b test from a
          # security assertion into a green tick.
          if PGPASSWORD=rt_ci pg_basebackup -h 127.0.0.1 -p 5433 -U postgres \
               -D /tmp/ci-basebackup-probe 2>/tmp/bb.err; then
            echo "::error::the Realtime test cluster permits physical replication (ADR-031)"
            exit 1
          fi
          grep -q "pg_hba.conf rejects replication connection" /tmp/bb.err || {
            echo "::error::base backup failed, but not because pg_hba rejected it:"
            cat /tmp/bb.err; exit 1; }
          echo "physical replication is rejected; logical decoding is not"

      - name: Pull the pinned Realtime image
        run: |
          # Upstream ships a container image and no binary (ADR-033), so the
          # slice 5 assertions need a runtime. Podman rather than Docker,
          # rootless, which is what the nodes run.
          sudo apt-get install -qq -y podman >/dev/null
          podman pull -q "$MALUDB_REALTIME_IMAGE"
          podman image exists "$MALUDB_REALTIME_IMAGE"
          echo "$MALUDB_REALTIME_IMAGE present"

      - name: Install PostgREST
        run: |
          curl -sL "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x86-64.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin
          postgrest --version

      - name: Install GoTrue
        run: |
          curl -sL "https://github.com/supabase/auth/releases/download/${GOTRUE_VERSION}/auth-${GOTRUE_VERSION}-amd64.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin
          # The archive ships `auth` plus a `gotrue` symlink; both land in
          # /usr/local/bin. The migrations directory beside them is what
          # `gotrue migrate` reads, so it must be extracted too, not just the
          # binary.
          test -x /usr/local/bin/gotrue
          # `gotrue migrate` reads the migrations directory that ships beside
          # the binary, not an embedded copy. Extracting only the executable
          # would leave a worker that starts and can never migrate a tenant, so
          # assert the directory landed rather than assuming tar took it.
          test -d /usr/local/bin/migrations
          echo "gotrue $GOTRUE_VERSION with $(ls /usr/local/bin/migrations | wc -l) migrations"

      - name: Resolve the compatibility suite's project hostname
        run: |
          # The suite drives the gateway over a real hostname, because the
          # hostname *is* the routing key (ADR-008) and a test that bypassed
          # DNS would not exercise it. One fixed entry, so this is environment
          # setup rather than something a test mutates while running.
          echo "127.0.0.1 cmpt0001.maludb.local" | sudo tee -a /etc/hosts > /dev/null
          getent hosts cmpt0001.maludb.local

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the official Supabase client
        working-directory: tests/compat
        # Pinned in package.json. AGENTS.md requires compatibility to be shown
        # with the official client; a reimplementation would test our reading
        # of it rather than the thing itself.
        run: npm install --no-audit --no-fund

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # A virtual environment, not --system: the runner's Python is Debian
      # externally-managed (PEP 668) and rejects --system installs. Using a venv
      # also makes CI run exactly what AGENTS.md tells a developer to run.
      #
      # --clear because setup-uv may already have created .venv, and plain
      # `uv venv` fails outright when one exists. --clear succeeds either way,
      # so this step does not depend on what the action did or did not leave
      # behind.
      - name: Install
        run: |
          uv venv --python 3.12 --clear
          uv pip install -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: ruff check .

      # Before the tests, not after: the integration test fixtures migrate the
      # database themselves, so running this afterwards reported "up to date"
      # and verified nothing. Ordered first, the assertion is real.
      - name: Migrations apply from empty
        run: |
          out=$(python -m services.control_plane.migrate)
          echo "$out"
          echo "$out" | grep -q "up to date" && {
            echo "::error::database was not empty; this step verified nothing"; exit 1; }
          exit 0

      - name: Migrations are re-runnable
        run: |
          out=$(python -m services.control_plane.migrate)
          echo "$out"
          echo "$out" | grep -q "up to date" || {
            echo "::error::re-running migrations was not a no-op"; exit 1; }

      - name: Tests
        run: pytest -q

      - name: OpenAPI spec is in sync with the app
        run: python scripts/export-openapi.py --check

      - name: No secrets committed
        run: |
          # Key material lives outside the repo; .dev/ is gitignored. This is a
          # backstop against the obvious mistakes, not a substitute for review.
          if git grep -nIE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . ; then
            echo "::error::private key material committed"; exit 1
          fi
          if git ls-files | grep -qE '(^|/)\.env$|(^|/)\.dev/'; then
            echo "::error::environment or dev key files committed"; exit 1
          fi
