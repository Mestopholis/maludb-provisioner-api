<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>MaluDB operator console</title>
    <link rel="stylesheet" href="./assets/styles.css">
    <link rel="stylesheet" href="./assets/admin.css">
    <!-- Applies a remembered theme before paint. A file, not inline: the console's CSP allows no inline script. -->
    <script src="./theme.js"></script>
  </head>
  <!--
    The operator console (ADR-082 slice 4). Served only by the admin listener, never from the public
    site's document root. Everything it shows comes from /admin/v1 as the signed-in staff member;
    nothing is written to browser storage except the theme.
  -->
  <body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"></ellipse><path d="M4.5 5.5v6.5c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V5.5"></path><path d="M4.5 12v6.5c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V12"></path></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"></path><path d="M6 9.5V20h12V9.5"></path><path d="M10 20v-5.5h4V20"></path></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"></rect><path d="m7 9.5 3 2.5-3 2.5"></path><path d="M12.5 15h4.5"></path></symbol>
      <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"></rect><path d="M3 9.5h18"></path><path d="M3 14.5h18"></path><path d="M9.5 9.5v10"></path></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"></circle><path d="m11 12 8.5-8.5"></path><path d="m16.5 6.5 2.5 2.5"></path><path d="m14 9 2 2"></path></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4"></path><path d="M4 20h16"></path><path d="M8.5 16v-5"></path><path d="M13 16V8"></path><path d="M17.5 16v-3"></path></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18.5l-1.8-5.9-5.7-1.8L10.2 9z"></path><path d="M18.5 16.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"></path></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"></circle><path d="M3 19.5c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"></path><path d="M15.5 5.2a3.5 3.5 0 0 1 0 6.6"></path><path d="M17.5 14.3c2 .7 3.5 2.5 3.5 5.2"></path></symbol>
      <symbol id="i-token" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path><path d="M12 14.5v2.5"></path></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4.5 19.5v-14a2 2 0 0 1 2-2h13v14h-13a2 2 0 0 0-2 2z"></path><path d="M4.5 19.5a2 2 0 0 0 2 2h13v-4"></path></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"></path><path d="M4 3.5V8h4.5"></path><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"></path><path d="M20 20.5V16h-4.5"></path></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6.5h16"></path><path d="M4 12h16"></path><path d="M4 17.5h10"></path></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"></path></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"></path></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H14"></path><path d="m16 8 4 4-4 4"></path><path d="M9.5 12H20"></path></symbol>
      <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3.5v4.5M15 3.5v4.5"></path><path d="M6.5 8h11v3.5a5.5 5.5 0 0 1-11 0z"></path><path d="M12 17v3.5"></path></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6.5 3.5h7l4.5 4.5v12.5h-11.5z"></path><path d="M13.5 3.5V8H18"></path></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2"></rect><path d="m3.5 7 8.5 6 8.5-6"></path></symbol>
      <symbol id="i-egress" viewBox="0 0 24 24"><path d="M12 20V6"></path><path d="m6.5 11 5.5-5.5 5.5 5.5"></path><path d="M4.5 3.5h15"></path></symbol>
    </svg>

    <header class="site-header">
      <nav class="nav">
        <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar"
          aria-expanded="false" aria-label="Menu"><svg class="icon"><use href="#i-menu"></use></svg></button>
        <a class="brand" href="#/" aria-label="Operator console home">
          <span class="brand-mark">M</span><span>Operator console</span>
        </a>
        <div class="nav-account" id="nav-account" hidden>
          <span class="nav-identity">
            <span class="avatar" id="staff-avatar" aria-hidden="true"></span>
            <span class="nav-identity-text">
              <span id="staff-name"></span>
              <span class="nav-email" id="staff-email"></span>
            </span>
          </span>
          <button class="icon-button" id="signout" type="button" title="Sign out" aria-label="Sign out">
            <svg class="icon"><use href="#i-logout"></use></svg></button>
        </div>
        <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
          <svg class="icon theme-dark"><use href="#i-moon"></use></svg><svg class="icon theme-light"><use href="#i-sun"></use></svg>
        </button>
      </nav>
    </header>

    <!-- Signed out: the only thing on the page. -->
    <main class="section staff-signin" id="signin" hidden>
      <div class="auth-layout">
        <div class="panel auth-card">
          <span class="auth-mark brand-mark" aria-hidden="true">M</span>
          <h1 class="signin-title">Staff sign-in</h1>
          <p class="usage-note">Platform staff only. Password and the code from your authenticator app.</p>
          <form id="signin-form" class="stack" novalidate>
            <p class="form-error" role="alert" hidden></p>
            <label>Email <input name="email" type="email" autocomplete="username" required></label>
            <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
            <label>Authenticator code
              <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,8}" maxlength="8" required>
            </label>
            <button class="button primary" type="submit" data-busy="Signing in…">Sign in</button>
          </form>
        </div>
      </div>
    </main>

    <!-- Signed in. -->
    <main class="console" id="console" hidden>
      <aside class="sidebar" id="sidebar">
        <a class="brand sidebar-brand" href="#/" aria-label="Operator console home">
          <span class="brand-mark">M</span><span>Operator</span>
        </a>
        <nav class="console-nav" aria-label="Operator console">
          <p class="nav-heading">Business</p>
          <a href="#/" data-nav="overview"><svg class="icon"><use href="#i-home"></use></svg><span>Overview</span></a>
          <a href="#/sales" data-nav="sales"><svg class="icon"><use href="#i-chart"></use></svg><span>Sales</span></a>
          <a href="#/billing-events" data-nav="billing-events"><svg class="icon"><use href="#i-file"></use></svg><span>Billing events</span></a>
          <a href="#/customers" data-nav="customers"><svg class="icon"><use href="#i-users"></use></svg><span>Customers</span></a>
          <p class="nav-heading">Platform</p>
          <a href="#/usage" data-nav="usage"><svg class="icon"><use href="#i-db"></use></svg><span>Usage</span></a>
          <a href="#/abuse" data-nav="abuse"><svg class="icon"><use href="#i-spark"></use></svg><span>Abuse review</span></a>
          <a href="#/nodes" data-nav="nodes"><svg class="icon"><use href="#i-grid"></use></svg><span>Nodes</span></a>
          <a href="#/provisioning" data-nav="provisioning"><svg class="icon"><use href="#i-terminal"></use></svg><span>Provisioning</span></a>
        </nav>
      </aside>
      <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>
      <div class="console-main">
        <div class="page-header">
          <div class="page-heading">
            <h1 id="page-title">Overview</h1>
            <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
          </div>
          <div class="page-actions" id="page-actions"></div>
        </div>
        <div class="page-body" id="view" aria-live="polite"></div>
      </div>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./admin.js"></script>
  </body>
</html>
