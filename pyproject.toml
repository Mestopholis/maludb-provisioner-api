[project]
name = "maludb-control-plane"
version = "0.1.0"
description = "MaluDB Platform control plane (ADR-024: Python 3.12, FastAPI, psycopg3, no ORM)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    # Gateway runtime (ADR-026). httpx was previously dev-only; the proxy needs
    # it to serve, so it moves into the runtime set rather than being installed
    # by accident in development and missing in production.
    "httpx>=0.27",
    # Minting the service_role token a secret key stands for. Signing HS256 is
    # simple enough to hand-roll, but this is the component a security review
    # will look hardest at, and "we wrote our own JWT" is not a sentence worth
    # defending for the sake of one dependency.
    "pyjwt>=2.9",
    # Proxying the Realtime surface (Phase 06 slice 3). It arrives anyway as a
    # transitive dependency of uvicorn[standard], which is exactly why it is
    # named here: the gateway imports it directly, and a runtime dependency held
    # only by somebody else's extra is one dependency bump away from vanishing.
    "websockets>=13",
    # The object store, over S3 (Phase 10 slice 3). ADR-055 makes S3 the
    # provider boundary deliberately, so the client for it should be the
    # standard one rather than ours.
    #
    # The same reasoning as pyjwt above, and it is the load-bearing half:
    # reaching the store means AWS SigV4 request signing, and "we wrote our own
    # request signing for the component holding every customer's files" is not a
    # sentence worth defending for the sake of one dependency. The platform uses
    # exactly two calls -- list a tenant's objects, and delete them -- and
    # neither is worth a hand-rolled signer.
    "boto3>=1.35",
    # Runtime, not dev, and it was in the wrong list. `cp-manage plans sync`
    # imports it -- and AGENTS.md calls that step mandatory, because nothing
    # else seeds the `plans` table and a control plane without a `free` plan
    # answers 503 to project creation. A production install without the `dev`
    # extra therefore failed the documented bring-up sequence at step 5. The
    # Phase 08 scanner is the second consumer: its rules are
    # `specs/compatibility-matrix.yaml` and `specs/extension-allowlist.yaml`,
    # which are data on purpose (ADR-045).
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
cp-migrate = "services.control_plane.migrate:main"
cp-manage = "services.control_plane.manage:main"
maludb-gateway = "services.gateway.main:main"
# ADR-042: the customer runs this, on their own machine, against their own
# Supabase project. It is not a control-plane route and holds no platform
# credential.
maludb-migrate = "services.migrate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]

# Matches the house style already established in maludb-python-api-server.
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101 assert-in-tests is fine; tests are not shipped.
per-file-ignores = { "tests/*" = ["S101"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
# `python -m pytest` puts the working directory on sys.path; bare `pytest` does
# not. Without this, tests/test_identity_api.py importing tests.conftest passes
# locally and fails in CI. Setting pythonpath makes the two invocations behave
# identically, so a local pass means what it appears to mean.
pythonpath = ["."]
