version: 1
policy:
  supported_definition: "Documented behavior plus automated compatibility coverage"
  default_status: planned
  # A feature moves off `planned` only when a test drives it with the official
  # client, through the real gateway, against a provisioned tenant -- not when
  # it is believed to work and not when a Python reimplementation of the client
  # passes. `evidence` names the case in tests/compat/suite.mjs that earned it,
  # so a claim can be traced to the thing that established it.
  promotion_rule: "Covered by tests/test_compatibility.py against @supabase/supabase-js"

surfaces:
  data_api:
    base_path: /rest/v1
    client: "@supabase/supabase-js"
    client_version_tested: "2.112.3"
    postgrest_version_tested: "14.17"
    features:
      select: {status: supported, phase: 3, evidence: "select"}
      insert: {status: supported, phase: 3, evidence: "insert, insert many"}
      update: {status: supported, phase: 3, evidence: "update"}
      delete: {status: supported, phase: 3, evidence: "delete"}
      # Requires GENERATED BY DEFAULT AS IDENTITY. Phase 00 finding 5: with
      # GENERATED ALWAYS the official client's upsert fails outright.
      upsert: {status: supported, phase: 3, evidence: "upsert"}
      # eq, neq, like and in. Not the whole PostgREST filter surface, so this
      # is narrower than "filters" sounds -- see the suite for the exact set.
      filters: {status: supported, phase: 3, evidence: "filters"}
      ordering: {status: supported, phase: 3, evidence: "ordering"}
      range_limit: {status: supported, phase: 3, evidence: "range and limit"}
      count: {status: supported, phase: 3, evidence: "count"}
      rpc: {status: supported, phase: 3, evidence: "rpc"}
      # Anonymous callers see an empty set rather than 42501, which migrated
      # applications distinguish (Phase 00 finding 7). Policies keyed to an
      # authenticated user are only exercised end to end once Auth lands, so
      # this covers the anon path and not the signed-in one.
      rls:
        status: supported
        phase: 4
        evidence: >-
          rls hides another tenant-scoped row;
          rls two signed-in users are distinguished;
          rls refuses a row claimed for another user;
          rls hides signed-in rows from an anonymous caller
        note: >-
          Phase 03 could claim only the anonymous path, because nothing issued
          end-user tokens. Phase 04 covers the signed-in path: auth.uid()
          resolved from a GoTrue-issued JWT that travelled through the gateway,
          two users distinguished on SELECT, and WITH CHECK enforced on INSERT.
          The last is verified from the victim's side rather than by asserting
          the insert errors -- with `.select()` it errors either way, because
          the SELECT policy hides the returned row, so that assertion passed
          even with WITH CHECK (true). Established by mutation, not by reading.
      # Deliberate divergence from Supabase, recorded per AGENTS.md.
      api_key_format:
        status: intentional_incompatibility
        note: >-
          Keys are mldb_publishable_* / mldb_secret_* rather than sb_*.
          Opaque to the client, which treats the key as a bearer token and
          never parses it, so no client behaviour changes. See ADR-028.
      extension_functions_as_rpc:
        status: intentionally_unsupported
        evidence: "extension functions are not exposed as rpc"
        note: >-
          maludb_core puts 373 functions in the exposed schema and Supabase
          hides them by relocating extensions, which maludb_core cannot do.
          They are revoked instead (ADR-018), so gen_salt and friends are not
          callable as RPC. This is a deliberate difference from a stock
          PostgREST deployment, not from Supabase, whose surface matches.

  auth:
    base_path: /auth/v1
    features:
      # Promoted only for what the official-client suite exercises through the
      # real gateway against a real GoTrue -- the policy this file states for
      # itself, and the AGENTS.md rule against claiming compatibility the tests
      # do not support.
      signup_password:
        status: supported
        phase: 4
        verified_by: >-
          auth signup;
          an unconfirmed user cannot sign in;
          following the confirmation link enables sign-in
        note: >-
          The suite runs with confirmation ON, which is the production posture
          ADR-019 requires. signUp returns a user and no session; sign-in is
          refused until the emailed link is followed. Adding these cases found
          that the gateway answered 401 for every confirmation link, because a
          browser following one sends no apikey header -- see PUBLIC_AUTH_PATHS.
      signin_password:
        status: supported
        phase: 4
        verified_by: "auth signin password, a wrong password is refused"
      session_refresh:
        status: supported
        phase: 4
        verified_by: "auth session refresh"
        note: >-
          An HS256 token is a pure function of its claims, so refreshing inside
          the same second returns a byte-identical access token. The suite
          checks the refreshed session works rather than that it changed.
      get_user:
        status: supported
        phase: 4
        verified_by: "auth get user"
      signout:
        status: supported
        phase: 4
        verified_by: "auth signout"
      oauth: {status: deferred}
      magic_link: {status: deferred}
      mfa: {status: deferred}
      enterprise_sso: {status: deferred}

  realtime:
    base_path: /realtime/v1
    features:
      postgres_changes:
        status: supported
        phase: 6
        verified_by: "tests/test_realtime_compat.py"
        note: >-
          The official client subscribes over the gateway, a row is written to a
          tenant table, and the change arrives -- tests/test_realtime_compat.py,
          against a real supabase/realtime instance and a real tenant. RLS over
          Postgres Changes is a separate claim and is not made yet: the
          replicator reads every table past policies, so the server is the only
          thing that can enforce them and nothing automated checks that it does.
      broadcast: {status: deferred}
      presence: {status: deferred}

  storage:
    base_path: /storage/v1
    features:
      # Phase 10 slice 5. Every one of these is claimed on the strength of
      # `@supabase/supabase-js` doing it over the gateway against a real
      # `storage-api` and a real provisioned tenant -- `AGENTS.md` does not let
      # a claim precede the test that holds it, and `tests/test_storage_compat.py`
      # is that test. It drives two projects, because the isolation half of the
      # claim cannot be made with one.
      buckets:
        status: supported
        phase: 10
        verified_by: "tests/test_storage_compat.py"
        note: >-
          createBucket, getBucket and listBuckets, with a secret key that the
          gateway translates into a service_role token. A customer does not
          receive ownership of the bucket table itself -- see
          storage_policy_authoring.
      upload:
        status: supported
        phase: 10
        verified_by: "tests/test_storage_compat.py"
        note: >-
          upload() and its upsert form. A duplicate without upsert answers 409,
          which is upstream's behaviour and one a migrating application relies
          on. Bodies are capped -- see upload_size_limit.
      download:
        status: supported
        phase: 10
        verified_by: "tests/test_storage_compat.py"
      delete:
        status: supported
        phase: 10
        verified_by: "tests/test_storage_compat.py"
        note: >-
          remove(), after which the object is no longer downloadable. Never
          refused for a project over its storage ceiling -- deleting is the way
          back under it (ADR-060).
      list:
        status: supported
        phase: 10
        verified_by: "tests/test_storage_compat.py"
        note: >-
          list() under a prefix. Subject to RLS on storage.objects like any
          other read, so a caller that cannot download an object is not told it
          exists.
      signed_urls:
        status: supported
        phase: 10
        verified_by: "tests/test_storage_compat.py"
        note: >-
          createSignedUrl for an object in a private bucket, followed with no
          API key at all -- which is the whole point of one, and which the
          gateway refused until ADR-062. Expiry is enforced, and a link signed
          for one project is not served by another. The upload half is
          separate; see signed_upload_urls.
      public_urls:
        status: supported
        phase: 10
        verified_by: "tests/test_storage_compat.py"
        note: >-
          getPublicUrl, fetched without a key. ADR-056 makes this the free
          tier's egress vector, so the bytes are counted against
          egress_bytes_per_month even though nobody authenticated.
      # Phase 10 slice 5, ADR-062. Deferred by decision rather than by
      # omission, and listed because a client that calls it gets a 401 rather
      # than a feature.
      signed_upload_urls:
        status: deferred
        phase: 10
        note: >-
          createSignedUploadUrl and uploadToSignedUrl. Upstream redeems these
          at PUT /object/upload/sign/<bucket>/<path>?token=..., which its own
          routing places in the group needing no JWT -- so honouring them means
          a *write* reachable with no API key. That is a decision of its own
          rather than a consequence of how the signed-download prefix is
          spelled, and it wants the upload ceiling and the egress meter thought
          through on an unauthenticated path first. Uploading with a key is
          unaffected.
      image_transformation: {status: deferred, phase: 10}
      resumable_upload: {status: deferred, phase: 10}
      s3_protocol: {status: deferred, phase: 10}
      # Phase 10 slice 1 found this and did not close it, so it is listed
      # before the features above are supported rather than after.
      #
      # On Supabase, a customer writes storage policies themselves -- the
      # dashboard's policy editor runs `CREATE POLICY ... ON storage.objects`,
      # and it works because Supabase's `postgres` role is a member of
      # `supabase_storage_admin`, which owns the table. `CREATE POLICY` needs
      # ownership; privileges are not enough.
      #
      # Here `storage.objects` is owned by `mldb_<ref>_storage`, and no
      # customer-reachable role is a member of it (bootstrap 012). So today the
      # authorization mechanism works -- tests/test_object_storage.py shows a
      # policy gating a switched role -- and the customer cannot author one.
      #
      # The MaluDB analogue of Supabase's arrangement would grant
      # `mldb_<ref>_admin` membership in the storage role, which is owner-level
      # bypass of every storage policy plus write access to the metadata the
      # object store is kept consistent with. That is a decision for the slice
      # that serves the Storage API, not the one that creates its schema.
      storage_policy_authoring:
        status: deferred
        phase: 10
        note: >-
          RLS policies on storage.objects are enforced but cannot be created by
          a customer: the table is owned by a platform-internal role and CREATE
          POLICY requires ownership. Slice 4 decided this and left it deferred
          (ADR-061) -- granting mldb_<ref>_admin membership in the storage role
          would bypass every storage policy including the customer's own, and
          would hand write access to the metadata that says which object bytes
          belong to whom. The shape that gives authoring safely is a mediated
          surface that validates what it creates, which is a slice rather than
          a grant. Public buckets need no policy and are unaffected.

      # Phase 10 slice 4, ADR-060. Two MaluDB behaviours with no Supabase
      # equivalent, listed because a client meets them at runtime: Supabase
      # meters storage and egress and bills for them, and ADR-050 gives this
      # platform no metering pipeline to do that with, so both are hard
      # ceilings that refuse.
      egress_ceiling:
        status: intentional_incompatibility
        phase: 10
        verified_by: "tests/test_gateway_storage.py"
        note: >-
          Bytes served from /storage/v1 are counted against
          egress_bytes_per_month. Over it, the gateway answers 429 with
          Retry-After set to the UTC month boundary and a body naming used,
          allowed and the reset date. Supabase bills the overage instead. The
          ceiling reaches anonymous reads of public buckets too, which is where
          a free project's egress actually goes.
      upload_size_limit:
        status: intentional_incompatibility
        phase: 10
        verified_by: "tests/test_gateway_storage.py"
        note: >-
          The gateway accepts an object body up to MALUDB_STORAGE_MAX_UPLOAD_BYTES,
          default 50 MiB, against Supabase's 50 MB default -- close enough that
          a migrating client meets no surprise, and configurable per deployment
          because it is a limit. Larger objects need resumable uploads, which
          this phase defers: the body is buffered in the gateway, so the answer
          to a much larger ceiling is streaming rather than a bigger number.
      storage_ceiling:
        status: intentional_incompatibility
        phase: 10
        verified_by: "tests/test_gateway_storage.py"
        note: >-
          A project over object_storage_bytes is refused uploads with 413 --
          the status upstream already returns for its own file-size limit, so
          an existing client error branch catches it; the body names the
          project's usage rather than the file's. Reads, lists and deletes are
          never refused for a full project: they are the only way back under
          the ceiling.

  database:
    features:
      # ADR-045. `permission denied` for everyone on every tier today
      # (negative test H); planned as a SECURITY DEFINER installer checking
      # specs/extension-allowlist.yaml. Listed here because a migrated schema
      # opens with `create extension if not exists "uuid-ossp"`, so this is a
      # compatibility fact rather than a platform nicety.
      extension_install_allowlisted: {status: planned, phase: 8}
      # Phase 08 slice 8. `pg_dump` writes `COMMENT ON SCHEMA "public" IS
      # 'standard public schema'` for every project, and `COMMENT ON SCHEMA`
      # requires ownership of the schema. A tenant's `public` is owned by the
      # platform -- customers do not receive ownership of their database's
      # schemas, which is an architectural invariant -- so the statement is
      # dropped by the migration rather than failing it. Comments on the
      # customer's *own* schemas, and on tables and columns, are carried.
      schema_comment_on_public:
        status: intentional_incompatibility
        phase: 8
        note: >-
          A comment on the `public` schema is not carried. It needs schema
          ownership, which no customer holds on either the source or the
          destination -- pg_dump's own text for it is 'standard public schema'.
          tests/test_migration_verify.py pins that a customer's own schema
          comments and table comments are kept.
      direct_connection_free: {status: intentionally_unsupported}
      direct_connection_paid: {status: planned, phase: 9}
      pooled_connection_paid: {status: planned, phase: 9}
