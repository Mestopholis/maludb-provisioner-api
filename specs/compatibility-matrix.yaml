version: 1
policy:
  supported_definition: "Documented behavior plus automated compatibility coverage"
  default_status: planned
  # A feature moves off `planned` only when a test drives it with the official
  # client, through the real gateway, against a provisioned tenant -- not when
  # it is believed to work and not when a Python reimplementation of the client
  # passes. `evidence` names the case in tests/compat/suite.mjs that earned it,
  # so a claim can be traced to the thing that established it.
  promotion_rule: "Covered by tests/test_compatibility.py against @supabase/supabase-js"

surfaces:
  data_api:
    base_path: /rest/v1
    client: "@supabase/supabase-js"
    client_version_tested: "2.112.3"
    postgrest_version_tested: "14.17"
    features:
      select: {status: supported, phase: 3, evidence: "select"}
      insert: {status: supported, phase: 3, evidence: "insert, insert many"}
      update: {status: supported, phase: 3, evidence: "update"}
      delete: {status: supported, phase: 3, evidence: "delete"}
      # Requires GENERATED BY DEFAULT AS IDENTITY. Phase 00 finding 5: with
      # GENERATED ALWAYS the official client's upsert fails outright.
      upsert: {status: supported, phase: 3, evidence: "upsert"}
      # eq, neq, like and in. Not the whole PostgREST filter surface, so this
      # is narrower than "filters" sounds -- see the suite for the exact set.
      filters: {status: supported, phase: 3, evidence: "filters"}
      ordering: {status: supported, phase: 3, evidence: "ordering"}
      range_limit: {status: supported, phase: 3, evidence: "range and limit"}
      count: {status: supported, phase: 3, evidence: "count"}
      rpc: {status: supported, phase: 3, evidence: "rpc"}
      # Anonymous callers see an empty set rather than 42501, which migrated
      # applications distinguish (Phase 00 finding 7). Policies keyed to an
      # authenticated user are only exercised end to end once Auth lands, so
      # this covers the anon path and not the signed-in one.
      rls: {status: supported, phase: 3, evidence: "rls hides another tenant-scoped row"}
      # Deliberate divergence from Supabase, recorded per AGENTS.md.
      api_key_format:
        status: intentional_incompatibility
        note: >-
          Keys are mldb_publishable_* / mldb_secret_* rather than sb_*.
          Opaque to the client, which treats the key as a bearer token and
          never parses it, so no client behaviour changes. See ADR-028.
      extension_functions_as_rpc:
        status: intentionally_unsupported
        evidence: "extension functions are not exposed as rpc"
        note: >-
          maludb_core puts 373 functions in the exposed schema and Supabase
          hides them by relocating extensions, which maludb_core cannot do.
          They are revoked instead (ADR-018), so gen_salt and friends are not
          callable as RPC. This is a deliberate difference from a stock
          PostgREST deployment, not from Supabase, whose surface matches.

  auth:
    base_path: /auth/v1
    features:
      # Promoted only for what the official-client suite exercises through the
      # real gateway against a real GoTrue -- the policy this file states for
      # itself, and the AGENTS.md rule against claiming compatibility the tests
      # do not support.
      signup_password:
        status: supported
        phase: 4
        verified_by: "auth signup"
        note: >-
          Email confirmation is disabled in the suite. Confirmed signup needs
          the relay, which is slice 4; ADR-019 makes confirmation the default.
      signin_password:
        status: supported
        phase: 4
        verified_by: "auth signin password, a wrong password is refused"
      session_refresh:
        status: supported
        phase: 4
        verified_by: "auth session refresh"
        note: >-
          An HS256 token is a pure function of its claims, so refreshing inside
          the same second returns a byte-identical access token. The suite
          checks the refreshed session works rather than that it changed.
      get_user:
        status: supported
        phase: 4
        verified_by: "auth get user"
      signout:
        status: supported
        phase: 4
        verified_by: "auth signout"
      oauth: {status: deferred}
      magic_link: {status: deferred}
      mfa: {status: deferred}
      enterprise_sso: {status: deferred}

  realtime:
    base_path: /realtime/v1
    features:
      postgres_changes: {status: planned, phase: 6}
      broadcast: {status: deferred}
      presence: {status: deferred}

  storage:
    base_path: /storage/v1
    features:
      buckets: {status: deferred, phase: 10}
      upload: {status: deferred, phase: 10}
      download: {status: deferred, phase: 10}
      delete: {status: deferred, phase: 10}
      signed_urls: {status: deferred, phase: 10}

  database:
    features:
      direct_connection_free: {status: intentionally_unsupported}
      direct_connection_paid: {status: planned, phase: 9}
      pooled_connection_paid: {status: planned, phase: 9}
