# The extension versions a node may be pinned to (ADR-075 decision 5).
#
# A version appears here only once CI has run the suite against it. Changing this
# file is a reviewed pull request; `cp-manage node pin set` refuses anything not
# listed, so a typo or an untested release cannot become a production pin.
#
# Only the two extensions ADR-075 pins exactly. The contrib extensions follow the
# PostgreSQL minor version and are recorded by `cp-manage node extension-check`,
# never pinned (decision 2).
#
# `package_version` is the Debian package, for the node build's `apt-mark hold`
# and for CI to install exactly. apt.postgresql.org does not keep old packages
# forever; one pruned from it stays installable from apt-archive.postgresql.org,
# and a version available from neither comes off this list.
version: 1
extensions:
  vector:
    - version: "0.8.4"
      package: postgresql-17-pgvector
      package_version: "0.8.4-1.pgdg24.04+1"
      tested: >-
        CI on noble until apt.postgresql.org published 0.8.5 (2026-07); the
        development node's version, which every local run since has used.
    - version: "0.8.6"
      package: postgresql-17-pgvector
      package_version: "0.8.6-1.pgdg24.04+1"
      tested: >-
        CI on noble, installed unpinned from apt.postgresql.org (run 34728466989,
        2026-09-13); and pinning slice 0's spike, upgraded to under live tenants.
  maludb_core:
    - version: "0.104.0"
      source: https://github.com/maludb/maludb-core
      commit: b4d6d521cb94cb0c05cfbadd2a9958c2e5ddfc4f
      tested: >-
        MALUDB_CORE_REF in .github/workflows/ci.yml until registration slice 2;
        still installed beside 0.105.0 as tests/test_maludb_core_dump.py's control
        and as the pre-registration source test_extension_data.py carries from.
    - version: "0.105.0"
      source: https://github.com/maludb/maludb-core
      commit: 2f2acac08989ed056a4386cb612e3e7a5f6daf93
      tested: >-
        MALUDB_CORE_REF in .github/workflows/ci.yml, built by CI on every run
        until 0.105.2 was pinned. The first version whose data survives pg_dump
        (ADR-078, maludb-core#28, with #30's aligned bytea reads); listed because
        tests/test_maludb_core_dump.py proves a customer row in every registered
        table arrives and no installed row is duplicated. What tenants run until
        upgraded.
    - version: "0.105.2"
      source: https://github.com/maludb/maludb-core
      commit: c53e4778a4b3ebbb0d1e14f74518b19aa7c1048b
      tested: >-
        MALUDB_CORE_REF in .github/workflows/ci.yml, built by CI on every run
        until 0.105.3 was pinned. Carries 0.105.1's exact malu_vector text output (maludb-core#31), so dumps
        and copies keep embeddings bit for bit, and indexes the three foreign keys
        the extension deletes in bulk (maludb-core#33, #34): deleting a memory
        space's data, replacing communities, and deleting ANN-indexed compartments
        were each quadratic without them (specs/maludb-memory-pipeline-model.md,
        "Deletion at scale").
    - version: "0.105.3"
      source: https://github.com/maludb/maludb-core
      commit: d0d75a6cd210d67d87804cc3f4c625bf986b93d3
      tested: >-
        MALUDB_CORE_REF in .github/workflows/ci.yml, built by CI on every run.
        Text comparisons in the 17 functions that take a `name` argument and
        compare text to an indexed column now use the column's collation
        (maludb-core#35, #36). Under 0.105.2 PL/pgSQL gave them collation "C", so
        the dirty-queue purge fired per deleted statement scanned the whole queue
        and memory search filtered every compartment of a schema. Deleting 32,000
        memory items: 60-66 s on 0.105.2, 13.1 s on 0.105.3
        (specs/maludb-memory-pipeline-model.md, "Deletion on 0.105.2, and the
        collation scan").
