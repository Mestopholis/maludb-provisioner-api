openapi: 3.1.0
info:
  title: MaluDB Control Plane API
  version: 0.1.0
  description: >-
    Starter contract. Exact response schemas remain to be finalized.
    Authentication is defined below; see docs/ACCOUNTS.md and ADR-021.
    These credentials are platform-user credentials and are unrelated to
    project API keys or to end-user tokens issued by a tenant's Auth service.

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: >-
        Dashboard session. Server-side record, revocable immediately.
        Sensitive operations additionally require a recent re-authentication
        and, where enrolled, a satisfied MFA challenge.
    personalAccessToken:
      type: http
      scheme: bearer
      description: >-
        CLI/CI credential. Prefixed, stored hashed, scoped, optionally
        expiring. Carries its user's permissions in the organizations that
        user belongs to, never more.

security:
  - sessionToken: []
  - personalAccessToken: []

paths:
  /v1/organizations:
    get:
      summary: List organizations the authenticated user belongs to
      responses:
        "200":
          description: Organization list
    post:
      summary: Create an organization
      responses:
        "201":
          description: Created

  /v1/organizations/{org_slug}/members:
    get:
      summary: List members and roles
      parameters:
        - in: path
          name: org_slug
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Members

  /v1/organizations/{org_slug}/invitations:
    get:
      summary: List pending invitations
      parameters:
        - in: path
          name: org_slug
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Pending invitations
    post:
      summary: Invite a user by email
      description: Requires owner or admin. Sends mail via the relay (ADR-019).
      parameters:
        - in: path
          name: org_slug
          required: true
          schema: {type: string}
      responses:
        "201":
          description: Invitation created

  /v1/projects:
    get:
      summary: List projects visible to the authenticated account
      responses:
        "200":
          description: Project list
    post:
      summary: Create a project on an existing MaluDB node
      responses:
        "202":
          description: Provisioning accepted

  /v1/projects/{project_ref}:
    get:
      summary: Get project
      parameters:
        - in: path
          name: project_ref
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Project

    delete:
      summary: Request project deletion
      parameters:
        - in: path
          name: project_ref
          required: true
          schema: {type: string}
      responses:
        "202":
          description: Deletion accepted

  /v1/projects/{project_ref}/upgrade:
    post:
      summary: Change project plan without normally moving the tenant database
      parameters:
        - in: path
          name: project_ref
          required: true
          schema: {type: string}
      responses:
        "202":
          description: Upgrade accepted

  /v1/projects/{project_ref}/suspend:
    post:
      summary: Suspend project access
      parameters:
        - in: path
          name: project_ref
          required: true
          schema: {type: string}
      responses:
        "202":
          description: Suspension accepted

  /v1/projects/{project_ref}/resume:
    post:
      summary: Resume a suspended/paused project
      parameters:
        - in: path
          name: project_ref
          required: true
          schema: {type: string}
      responses:
        "202":
          description: Resume accepted

  /v1/projects/{project_ref}/keys:
    get:
      summary: List API-key metadata
      parameters:
        - in: path
          name: project_ref
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Key metadata
    post:
      summary: Create/rotate a project API key
      parameters:
        - in: path
          name: project_ref
          required: true
          schema: {type: string}
      responses:
        "201":
          description: Newly created key; secret material may be returned only at creation

  /v1/projects/{project_ref}/usage:
    get:
      summary: Project usage and limits
      parameters:
        - in: path
          name: project_ref
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Usage
