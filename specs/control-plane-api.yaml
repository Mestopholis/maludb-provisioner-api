info:
  description: Platform-user credentials only. Unrelated to project API keys or to end-user tokens issued
    by a tenant's Auth service.
  title: MaluDB Control Plane API (public)
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Successful Response
      summary: Liveness probe
      tags:
      - health
  /readyz:
    get:
      operationId: readyz_readyz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Successful Response
      summary: Readiness probe
      tags:
      - health
  /v1/auth/me:
    get:
      operationId: me_v1_auth_me_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: Successful Response
      security:
      - platformCredential: []
      summary: Describe the authenticated principal
      tags:
      - auth
  /v1/auth/password-reset:
    post:
      description: '202 whether or not the address belongs to anybody.


        A different answer for a registered address would be a membership oracle for

        any address someone cared to try -- and the addresses worth checking are the

        ones worth attacking. The rate limit is per source *and* per address for the

        same reason it is on signin: one host working through a list and a

        distributed attempt against one person are different attacks.'
      operationId: request_password_reset_v1_auth_password_reset_post
      requestBody:
        content:
          application/json:
            schema:
