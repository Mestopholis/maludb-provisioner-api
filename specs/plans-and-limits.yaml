# Plan entitlements.
#
# These are the defaults `services/control_plane/entitlements.py` resolves to,
# written here so the numbers can be read without reading code. They are
# starting values, not approved public pricing: AGENTS.md forbids hard-coding
# production plan limits in application logic, and `plans.config_json` overrides
# any of them per project without a release.
#
# A missing or unusable value resolves to the default for the tier, never to
# "unlimited" -- the file previously carried nulls meaning "not yet approved",
# and a null read as no-limit would make the free tier unbounded.
#
# Timeouts follow PostgreSQL's convention: 0 means no limit.
version: 1
plans:
  free:
    # The catalogue's display name. `cp-manage plans sync` seeds the plans
    # table from this file, and a catalogue row needs something to show.
    name: Free
    direct_database_access: false
    # ADR-039: the platform runs SQL on the project's behalf. Distinct from
    # direct_database_access, which stays paid -- this grants no credential and
    # opens no port. Free has no other way to create a table.
    sql_console: true
    api_worker_policy: sleep_when_inactive
    # ADR-065. Which pool of nodes a project on this plan may be placed in.
    # Plan-level rather than a limit: it says what kind of plan this is, not
    # how much of something it gets.
    #
    # Every tier ships as `shared`, so the mechanism arrives switched off and an
    # upgrade changes no placement. Separation is an explicit act: set this and
    # register nodes in that pool. There is NO fallback -- a plan naming a pool
    # with no node has its projects refused rather than quietly placed beside
    # the free tier.
    node_pool: shared
    limits:
      api_requests_per_window: 300
      api_window_seconds: 60
      concurrent_api_requests: 10
      active_database_queries: null
      database_connections: 10
      statement_timeout_ms: 8000
      lock_timeout_ms: 3000
      idle_in_transaction_timeout_ms: 30000
      work_mem_mb: 4
      temp_file_limit_mb: 256
      max_parallel_workers_per_gather: 0
      database_storage_bytes: 524288000
      # ADR-056, both hard ceilings under ADR-050: refused at the point of
      # use, never converted into a charge. 1 GiB held, 5 GiB served a month.
      object_storage_bytes: 1073741824
      egress_bytes_per_month: 5368709120
      realtime_connections: 0
      max_projects: 2
      emails_per_day: 100
      emails_per_month: 1000
      email_warmup_daily_cap: null
      email_custom_sending_domain: false
      email_confirmations_required: true
      postgrest_pool_size: 3
      sql_console_row_limit: 100
      # A row cap bounds rows, not bytes: a hundred rows of a megabyte each
      # is inside the limit above and is a hundred megabytes of shared
      # control-plane memory. Spent across a whole response -- every result
      # set of a multi-statement request, every catalogue of a schema read.
      sql_console_max_bytes: 2097152
      sql_console_concurrent: 1
      sql_console_timeout_ms: 8000
      # ADR-068. Recovery is a promise about time, not a repository setting: a
      # pgBackRest repository retains per node, so nothing here makes one
      # tenant's bytes outlive another's on the same cluster. What a plan buys
      # is how far back the platform will honour a request.
      #
      # Free is backed up, because it is on a node and a node is backed up
      # whole -- ~2.5 MB of repository per tenant at the 24 MB floor, after the
      # measured 9.4:1 compression. What free does not get is a point in time:
      # pitr_window_hours 0 means "restore to the state of a backup", and it is
      # 0 because PITR's cost is the archive and the per-request restore rather
      # than the backup.
      backup_retention_days: 7
      pitr_window_hours: 0
  starter:
    # The catalogue's display name. `cp-manage plans sync` seeds the plans
    # table from this file, and a catalogue row needs something to show.
    name: Starter
    direct_database_access: true
    sql_console: true
    api_worker_policy: warm
    node_pool: shared          # ADR-065; see the free tier's note
    limits:
      api_requests_per_window: 3000
      api_window_seconds: 60
      concurrent_api_requests: 50
      active_database_queries: null
      database_connections: 30
      statement_timeout_ms: 30000
      work_mem_mb: 8
      temp_file_limit_mb: 2048
      max_parallel_workers_per_gather: 2
      database_storage_bytes: 8589934592
      object_storage_bytes: 26843545600
      egress_bytes_per_month: 107374182400
      emails_per_day: 5000
      emails_per_month: 50000
      email_warmup_daily_cap: null
      email_custom_sending_domain: true
      email_confirmations_required: true
      postgrest_pool_size: 6
      lock_timeout_ms: 10000
      idle_in_transaction_timeout_ms: 120000
      realtime_connections: 200
      max_projects: 20
      sql_console_row_limit: 1000
      sql_console_max_bytes: 8388608
      sql_console_concurrent: 3
      sql_console_timeout_ms: 30000
      # A week of point-in-time inside a fortnight of retention. Seven days
      # covers "we noticed on Monday what we did on Tuesday", which is the
      # incident PITR is bought for.
      backup_retention_days: 14
      pitr_window_hours: 168
  production:
    # The catalogue's display name. `cp-manage plans sync` seeds the plans
    # table from this file, and a catalogue row needs something to show.
    name: Production
    direct_database_access: true
    sql_console: true
    api_worker_policy: warm
    node_pool: shared          # ADR-065; see the free tier's note
    limits:
      api_requests_per_window: 30000
      api_window_seconds: 60
      concurrent_api_requests: 200
      active_database_queries: null
      database_connections: 90
      statement_timeout_ms: 0
      work_mem_mb: 16
      temp_file_limit_mb: 16384
      max_parallel_workers_per_gather: 4
      database_storage_bytes: 107374182400
      object_storage_bytes: 268435456000
      egress_bytes_per_month: 1099511627776
      emails_per_day: 50000
      emails_per_month: 1000000
      email_warmup_daily_cap: null
      email_custom_sending_domain: true
      email_confirmations_required: true
      postgrest_pool_size: 12
      lock_timeout_ms: 30000
      idle_in_transaction_timeout_ms: 300000
      realtime_connections: 2000
      max_projects: 100
      sql_console_row_limit: 5000
      # The number to lower first if a control plane is sized smaller than
      # this plan assumes: ten concurrent statements may each reach it.
      sql_console_max_bytes: 33554432
      sql_console_concurrent: 10
      # Not 0, unlike statement_timeout_ms above. Zero means no limit to
      # PostgreSQL, and the console's ceiling is enforced by the platform
      # cancelling a statement it is holding a connection for -- so zero here
      # would remove the control rather than relax it. `entitlements.py` refuses
      # a zero and falls back to this number for the same reason.
      sql_console_timeout_ms: 60000
      # A month, addressable to the second for the whole of it. This is the
      # number that sets what a *node* must keep: `cp-manage node backup-policy`
      # compares the longest promise any offered plan makes against
      # repo1-retention-full, and a node that keeps less fails its readiness
      # check rather than quietly under-delivering.
      backup_retention_days: 30
      pitr_window_hours: 720
